name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake \
            glslc glslang-tools spirv-headers spirv-tools libvulkan-dev

      - name: Build whisper.cpp (Vulkan)
        env:
          PREFIX: ${{ github.workspace }}/whisper-prefix
        run: |
          git clone --depth=1 https://github.com/ggerganov/whisper.cpp
          git clone --depth=1 https://github.com/KhronosGroup/Vulkan-Headers
          cmake -S whisper.cpp -B whisper.cpp/build \
            -DGGML_VULKAN=1 -DCMAKE_BUILD_TYPE=Release \
            -DVulkan_INCLUDE_DIR="$PWD/Vulkan-Headers/include"
          cmake --build whisper.cpp/build -j"$(nproc)"
          cmake --install whisper.cpp/build --prefix "$PREFIX"
          cat > "$PREFIX/lib/pkgconfig/whisper.pc" <<EOF
          prefix=$PREFIX
          libdir=\${prefix}/lib
          includedir=\${prefix}/include

          Name: whisper
          Description: Port of OpenAI's Whisper model in C/C++
          Version: 1.9.0
          Libs: -L\${libdir} -lwhisper -lggml -lggml-base -lggml-cpu -lggml-vulkan
          Cflags: -I\${includedir}
          EOF

      - name: Test and build
        env:
          PREFIX: ${{ github.workspace }}/whisper-prefix
          PKG_CONFIG_PATH: ${{ github.workspace }}/whisper-prefix/lib/pkgconfig
          CGO_ENABLED: "1"
        run: |
          go test ./...
          make build

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install MinGW, CMake, Ninja
        run: choco install mingw cmake ninja -y --no-progress

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.0
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader, Glslang
          vulkan-use-cache: true

      - name: Add MinGW to PATH
        shell: pwsh
        run: |
          $mingw = "C:\ProgramData\mingw64\mingw64\bin"
          if (-not (Test-Path $mingw)) {
            $mingw = "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin"
          }
          if (Test-Path $mingw) {
            echo $mingw | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          gcc --version
          cmake --version

      - name: Build whisper.cpp (Vulkan)
        shell: pwsh
        run: .\scripts\build-whisper-windows.ps1

      - name: Test (non-cgo packages)
        shell: pwsh
        run: |
          go test ./internal/audio ./internal/config ./internal/history ./internal/inject `
            ./internal/ipc ./internal/models ./internal/overlay ./internal/platform `
            ./internal/postprocess ./internal/tray ./internal/winhotkey

      - name: Build vole.exe
        shell: pwsh
        run: .\scripts\build-windows.ps1
